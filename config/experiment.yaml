# Congelar este arquivo após o piloto. Toda alteração deve ser registrada no artigo.

selection:                     # critérios de 00_select_repos.py → data/repos.csv
  min_stars: 1000
  max_size_mb: 200
  min_linked_prs: 10           # PRs mesclados vinculados a issues no período
  created_before: "2023-01-01" # C7: projetos estabelecidos antes da popularização de agentes
  min_test_files: 20           # C8: arquivos test_*.py / *_test.py
  heavy_deps:                  # C9: dependências pesadas de ML/GPU
    [torch, tensorflow, jax, jaxlib, paddlepaddle, onnxruntime, cupy, triton,
     nvidia-, transformers, vllm, xformers]
  exclude_file: "config/excluded_repos.csv"   # C10: exclusões manuais justificadas
  max_repos: 20                # aprovados, em ordem decrescente de estrelas

mining:
  since: "2025-01-01"          # posterior ao corte de treinamento do modelo
  until: "2026-10-31"
  max_code_files: 3            # patch humano com até N arquivos de código
  max_candidates_per_repo: 10

validation:
  repeats: 3                   # execuções por versão para descartar testes flaky
  install_timeout_s: 900
  test_timeout_s: 900

models:                        # cada modelo roda C1, C2 e C3 sobre o mesmo corpus
  - name: "ollama_chat/qwen2.5-coder:7b"
  - name: "ollama_chat/deepseek-coder-v2:16b"

generation:                    # parâmetros comuns a todos os modelos
  api_base: "http://localhost:11434"
  temperature: 0.3
  seed: 42
  num_ctx: 32768               # o Ollama trunca o contexto sem avisar se omitido

agent:
  step_limit: 50               # máximo de ações por execução
  command_timeout_s: 120          # prompts: configuração padrão do mini-swe-agent

codescout:                       # reimplementação de Suri et al. (2026)
  tau: 5                         # limiar de relevância (nota 0-10 do Stage 2); não informado no artigo
  max_targets: 10                # Stage 1 pede "exactly 5-10 targets"
  max_tree_chars: 60000          # limite da árvore de arquivos no prompt do Stage 1
  max_target_chars: 12000        # limite do código de cada alvo no prompt do Stage 2

conditions: [C1, C2, C3]
runs_per_condition: 1          # k; aumentar num subconjunto se a cota permitir
